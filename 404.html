<style>
:root{--bg:#0a0a0c;--ln:rgba(255,255,255,.07);--tx:#f2f2f4;--dim:#6c6d76;--ac:#ff2e9a;--ac-line:rgba(255,46,154,.42);--ac-soft:rgba(255,46,154,.08);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--san:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 var(--san);
  display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:400px;border:1px solid var(--ln);border-radius:12px;
  background:#0e0e13;padding:26px 24px}
.brand{display:flex;align-items:center;gap:8px;font:500 12px var(--mono);color:var(--dim);margin-bottom:18px}
.brand svg{width:15px;height:15px;color:var(--ac)}
.code{font:600 44px/1 var(--san);color:var(--ac);letter-spacing:-.03em}
.msg{margin-top:12px;font:13px/1.6 var(--san)}
.sub{margin-top:6px;font:11.5px/1.5 var(--mono);color:var(--dim)}
.row{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
a{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:8px;text-decoration:none;
  font:12px var(--san);border:1px solid var(--ln);color:var(--tx);transition:border-color .15s,background .15s}
a:hover{border-color:var(--ac-line);background:var(--ac-soft)}
a.g{border-color:var(--ac);background:var(--ac);color:#0a0a0c}
a.g:hover{filter:brightness(1.08)}
a svg{width:15px;height:15px}
@media(max-width:420px){.code{font-size:38px}.card{padding:22px 18px}}
</style></head>
