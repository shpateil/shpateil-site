<style>
:root{color-scheme:dark;--bg:#0a0a0c;--p:#0e0e13;--ln:rgba(255,255,255,.07);--ln2:rgba(255,255,255,.14);--tx:#f2f2f4;--mut:#a6a7ae;--dim:#6c6d76;--gn:#3cec80;--ac:#ff2e9a;--ac-line:rgba(255,46,154,.45);--ac-soft:rgba(255,46,154,.12);--mono:ui-monospace,'SF Mono','JetBrains Mono','Cascadia Mono','DejaVu Sans Mono',monospace;--san:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',Ubuntu,Arial,sans-serif}
*{-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:auto;min-height:100%}body{min-height:100dvh;font-family:var(--san);color:var(--tx);letter-spacing:-.006em;background:var(--bg);display:flex;flex-direction:column}
.tw{width:100%;max-width:720px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid var(--ln)}
.brand{font-weight:650;font-size:16px;display:flex;align-items:center;gap:9px}.brand b{font-weight:650}
.mut{color:var(--dim);font-family:var(--mono);font-size:12px}
.sp{flex:1}
.ib{width:34px;height:34px;border:1px solid var(--ln2);border-radius:10px;display:inline-grid;place-items:center;color:var(--mut);background:var(--p);cursor:pointer;transition:color .15s cubic-bezier(.2,.7,.3,1),border-color .15s cubic-bezier(.2,.7,.3,1),transform .15s cubic-bezier(.2,.7,.3,1)}.ib:hover{color:var(--ac);border-color:var(--ac-line)}
.ib:focus-visible,.soc:focus-visible,.btn:focus-visible{outline:2px solid var(--ac-line);outline-offset:2px}
.ib svg{width:17px;height:17px}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 0 44px;flex:1 0 auto}
.ava{width:64px;height:64px;border-radius:18px;border:1px solid var(--ln2);background:var(--p);display:grid;place-items:center}.ava svg{width:30px;height:30px}
h1{font-weight:640;font-size:clamp(36px,9vw,60px);letter-spacing:-.035em;text-wrap:balance;margin-top:22px}
h1 .pk,h1 .gr{letter-spacing:-.01em}
.pk{color:var(--ac)}.gr{color:var(--ac)}
.st{font-family:var(--mono);color:var(--mut);font-size:13.5px;margin:14px auto 0;max-width:34ch;text-align:center;text-wrap:balance;line-height:1.5;min-height:2.6em}
.socials{display:flex;gap:13px;margin-top:34px;flex-wrap:wrap;justify-content:center}
.soc{width:50px;height:50px;border:1px solid var(--ln2);border-radius:14px;background:var(--p);color:var(--mut);display:grid;place-items:center;cursor:pointer;position:relative;transition:color .2s cubic-bezier(.2,.7,.3,1),border-color .2s cubic-bezier(.2,.7,.3,1),transform .2s cubic-bezier(.2,.7,.3,1)}
.soc:hover{color:var(--ac);border-color:var(--ac-line);transform:translateY(-1px)}
.soc svg{width:23px;height:23px}
.gl::before,.gl::after{content:"";position:absolute;inset:0;border-radius:inherit;background-repeat:no-repeat;background-position:center;background-size:23px;opacity:0;pointer-events:none}
.gl:hover::before{opacity:1;animation:ga .32s steps(2) infinite;background:var(--g1)}
.gl:hover::after{opacity:1;animation:gb .26s steps(2) infinite .05s;background:var(--g2)}
@keyframes ga{to{transform:translate(-2px,0)}}@keyframes gb{to{transform:translate(2px,1px)}}
.ft{width:100%;border-top:1px solid var(--ln);background:#0b0b0e}.ft .tw{display:flex;justify-content:space-between;align-items:center;min-height:46px;color:var(--dim);font-size:11px;font-family:var(--mono)}
.mono{font-family:var(--mono)}
.ov{position:fixed;inset:0;background:rgba(3,3,5,.72);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);z-index:40;display:none;align-items:flex-start;justify-content:center;padding:7vh 16px;overflow:auto}.ov.open{display:flex}
.modal{width:100%;max-width:720px;background:#0d0d11;border:1px solid var(--ln2);border-radius:16px;padding:16px 16px 12px;box-shadow:0 24px 80px -18px #000}
.boxlock{text-align:center;padding:20px 0 26px;display:flex;flex-direction:column;gap:10px;align-items:center}
.boxlock input{width:min(260px,90%);background:#101016;border:1px solid var(--ln2);border-radius:10px;padding:11px 14px;color:#eee;font-size:14px;text-align:center;outline:none}.boxlock input:focus{border-color:var(--ac)}
.btn{border:1px solid var(--ln2);background:#17171d;color:#eee;border-radius:9px;padding:8px 18px;font-size:13px;cursor:pointer;transition:background .15s cubic-bezier(.2,.7,.3,1),border-color .15s cubic-bezier(.2,.7,.3,1)}.btn:hover{background:#1f1f27;border-color:var(--ln2)}
.err{color:var(--ac);font-size:12px;height:16px}
.rowlog{display:grid;grid-template-columns:104px 1fr 96px 60px 66px;gap:8px;padding:7px 4px;border-bottom:1px solid var(--ln);font-family:var(--mono);font-size:12px;word-break:break-word}
.rowlog b{color:var(--ac);font-weight:400}.lmut{color:var(--dim)}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,12px);background:#0e0e12;border:1px solid var(--ac-line);color:var(--ac);font-family:var(--mono);font-size:12px;padding:9px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;box-shadow:0 10px 34px -14px rgba(0,0,0,.7);white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.rowlog{grid-template-columns:84px 1fr;gap:4px} .mut.hide{display:none}}
a{color:inherit;text-decoration:none}
::selection{background:var(--ac);color:var(--bg)}
.ib:focus-visible,.soc:focus-visible,.btn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#pw:focus-visible{outline:2px solid var(--ac);outline-offset:0}
.nick{position:relative;display:inline-block}

.soc.press,.ib.press{color:var(--ac);border-color:var(--ac-line);transform:scale(.96)}
.stat{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0 4px}
.statc{border:1px solid var(--ln2);background:var(--p);border-radius:11px;padding:7px 13px;min-width:86px}
.statc b{display:block;color:var(--ac);font-size:18px;line-height:1.1;font-weight:600}
.statc small{color:var(--dim);display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;margin-top:3px}
.statc.pink b{color:var(--ac)}
.stathead{color:var(--dim);font-family:var(--mono);font-size:11px;margin:10px 2px 6px}
.chips2{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--mono);font-size:11px}
.chip2{border:1px solid var(--ln2);border-radius:999px;padding:2px 10px;color:var(--mut);background:var(--p);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip2 b{color:var(--ac);font-weight:400}
.chip2.hot{color:var(--ac)}.chip2.hot b{color:var(--ac)}

<script>
(function(){var sc=screen,lg=navigator.language||'',tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}
fetch('/api/visit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({path:location.pathname,ref:(document.referrer||'').slice(0,200),lang:lg.slice(0,20),screen:(sc?sc.width+'x'+sc.height:''),tz:tz.slice(0,40)})}).catch(function(){})})();
function toast(m){var o=document.createElement('span');o.className='toast';o.textContent=m;document.body.appendChild(o);requestAnimationFrame(function(){o.classList.add('show')});setTimeout(function(){o.classList.remove('show');setTimeout(function(){o.remove()},250)},2000)}
/* --- фразы под ником (30, как в юзерботе) --- */
var PS=["i use arch btw", "[ ok ] started", "root@shpateil:~# _", "chmod 777 /everything", "works on my machine", "rtfm", "lurk moar", "google is your friend", "there's no place like 127.0.0.1", "you are not expected to understand this", "eternal september", "stay hungry, stay foolish", "the journey is the reward", "you only live once, but if you do it right, once is enough", "a smooth sea never made a skilled sailor", "wrong city, wrong people", "today was a good day", "it's the code you live by that defines who you are", "the moon. we're going to the moon", "get in the robot", "congratulations", "let's all love lain", "the cake is a lie", "don't mistake my silence for weakness", "keep your friends close, your enemies closer", "living that sudo life", "i hate you more.", "through the city by day, over the city by night", "life is short. use arch", "powered by caffeine and bad decisions"],ix=Math.floor(Math.random()*PS.length),se=document.getElementById('st'),iv=null;
function next(){ix=(ix+1)%PS.length;if(se)se.textContent=PS[ix]}
if(se){se.textContent=PS[ix];iv=setInterval(next,9000)}
document.addEventListener('visibilitychange',function(){if(document.hidden&&iv){clearInterval(iv);iv=null}else if(!iv&&se){iv=setInterval(next,9000)}});
document.getElementById('yr').textContent=new Date().getFullYear();
/* --- дискорд: копия ника shpateil --- */
(function(){var b=document.getElementById('dccopy');if(!b)return;b.addEventListener('click',function(e){e.preventDefault();var z=document.createElement('textarea');z.value='shpateil';z.style.cssText='position:fixed;opacity:0';document.body.appendChild(z);z.select();try{document.execCommand('copy')}catch(_){}z.remove();toast('discord username copied')})})();
/* --- админ: лог посещений --- */
var TK=sessionStorage.getItem('adtk')||null,ov=document.getElementById('ov'),lockw=document.getElementById('lockw'),lgb=document.getElementById('logs'),poll=null;
function ls(){lockw.style.display='none';lgb.style.display='block';ld();pane();if(poll)clearInterval(poll);poll=setInterval(function(){ld();pane()},9000)}
function op(){ov.classList.add('open');if(TK)ls()}
document.getElementById('btlog').onclick=op;
document.getElementById('mx').onclick=function(){ov.classList.remove('open')};
ov.addEventListener('click',function(e){if(e.target===ov)ov.classList.remove('open')});
document.addEventListener('keydown',function(e){if(e.key==='Escape')ov.classList.remove('open')});
function eS(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function ld(){if(!TK)return;fetch('/api/admin/logs',{headers:{'x-admin-token':TK}}).then(function(r){if(r.status===401){needAuth();return null}return r.json()}).then(function(j){if(!j)return;var es=(j&&j.entries)||[];var c=document.getElementById('cnt');if(c)c.textContent=es.length+' визитов';var H='';for(var k=0;k<es.length;k++){var e=es[k],d=new Date(e.at),ts=(isNaN(d)?(e.at||''):d.toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}));H+='<div class="rowlog"><span class="lmut">'+eS(ts)+'</span><span><b>'+eS(e.ip||'')+'</b> <span class="lmut">'+eS(e.device||'')+'</span></span><span class="lmut">'+eS(e.path||'/')+'</span><span class="lmut">'+eS(e.screen||'')+'</span></div>'}var R=document.getElementById('rows');R.innerHTML=H||'<p class="lmut" style="padding:12px">пусто</p>'}).catch(function(){})}
document.getElementById('unlock').onclick=function(){var p=document.getElementById('pw').value;var er=document.getElementById('lgerr');fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:p})}).then(function(r){return r.json()}).then(function(j){if(j&&j.token){TK=j.token;sessionStorage.setItem('adtk',TK);er.textContent='';ls()}else{er.textContent='нет доступа'}}).catch(function(){er.textContent='сеть'})};
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('unlock').click()});
document.getElementById('clr').onclick=function(){if(TK)fetch('/api/admin/logs',{method:'POST',headers:{'content-type':'application/json','x-admin-token':TK},body:JSON.stringify({op:'clear'})}).then(function(){ld()})};
document.getElementById('exportB').onclick=function(){if(!TK){toast('сначала войди');return}fetch('/api/admin/export',{headers:{'x-admin-token':TK}}).then(function(r){return r.text()}).then(function(t){var n=t.split(String.fromCharCode(10)).filter(Boolean).length;var z=document.createElement('textarea');z.value=t;z.style.cssText='position:fixed;opacity:0';document.body.appendChild(z);z.select();try{document.execCommand('copy')}catch(_){}z.remove();toast('скопировано для анализа '+n+' строк')}).catch(function(){toast('ошибка экспорта')})};
/* задержка перед уходом на ссылку: кнопка загорается, потом переход */
(function(){var links=document.querySelectorAll('a[href]');function grab(e){var a=e.currentTarget;if(a.classList.contains('dccopy')||a.getAttribute('data-no'))return;if(e.defaultPrevented)return;var href=a.href,bl=a.target==='_blank';e.preventDefault();a.classList.add('press');setTimeout(function(){a.classList.remove('press');if(bl){var w=window.open(href,'_blank');if(w)w.opener=null}else location.href=href},340)}Array.prototype.forEach.call(links,function(a){a.addEventListener('click',grab)})})();
 /* stats сводки */
function pane(){if(!TK)return;var num=function(v){return (typeof v==='number'&&isFinite(v))?v:0};var needAuth=function(){TK=null;sessionStorage.removeItem('adtk');document.getElementById('lockw').style.display='flex';document.getElementById('logs').style.display='none';var e=document.getElementById('lgerr');if(e)e.textContent='сессия истекла, войди заново'};fetch('/api/admin/stats',{headers:{'x-admin-token':TK}}).then(b=>{if(b.status===401){needAuth();return null}return b.json()}).then(s=>{var w=document.getElementById('stats');if(!w||!s)return;var refs=(s.top_refs||[]).map(x=>'<span class="chip2'+(x.v>=2?' hot':'')+'" title="реферер"><b>'+x.v+'</b> '+x.k+'</span>').join('')||'<span class="chip2">—</span>';
var bws=(s.browsers||[]).map(x=>'<span class="chip2"><b>'+x.v+'</b> '+x.k+'</span>').join('');
var ps=(s.top_paths||[]).map(x=>'<span class="chip2">'+x.v+' <span style="color:var(--dim)">'+x.k+'</span></span>').join('');
w.innerHTML='<div class="stat"><div class="statc"><b>'+num(s.total)+'</b><small>всего</small></div><div class="statc pink"><b>'+num(s.visits_24h)+'</b><small>визиты/24ч</small></div><div class="statc"><b>'+num(s.unique_ips_24h)+'</b><small>уник ip/24ч</small></div></div>'
+'<div class="stathead">браузеры/устройства</div><div class="chips2">'+bws+'</div>'
+'<div class="stathead">откуда (реферер)</div><div class="chips2">'+refs+'</div>'
+'<div class="stathead">пути</div><div class="chips2">'+ps+'</div>'}).catch(function(){})}
</script>
